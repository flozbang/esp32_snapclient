<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerät</title>
<style>
:root {
  --bg: #eef1f5;
  --card: #ffffff;
  --text: #172033;
  --muted: #667085;
  --primary: #163a70;
  --primary-2: #245493;
  --border: #d8dee8;
  --ok: #1f7a4d;
  --warn: #b26a00;
  --danger: #a33333;
  --shadow: 0 14px 40px rgba(23, 32, 51, 0.10);
  --radius: 18px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}
.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  background: var(--primary);
  color: white;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 3px 14px rgba(0,0,0,.14);
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand-title { font-size: 1.25rem; font-weight: 750; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: .82rem; opacity: .78; margin-top: 3px; }
.status-pill {
  padding: 8px 12px;
  border-radius: 999px;
  font-size: .8rem;
  font-weight: 700;
  background: rgba(255,255,255,.14);
  white-space: nowrap;
}
.page {
  width: min(1120px, calc(100% - 28px));
  margin: 28px auto 44px;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
.page-title { margin: 0; font-size: clamp(1.65rem, 3vw, 2.4rem); }
.page-copy { margin: 7px 0 0; color: var(--muted); max-width: 720px; line-height: 1.45; }
.grid { display: grid; gap: 18px; }
.grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
}
.nav-card {
  min-height: 190px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-decoration: none;
  color: inherit;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.nav-card:hover { transform: translateY(-2px); border-color: #b8c5d8; box-shadow: 0 18px 48px rgba(23,32,51,.14); }
.nav-card h2 { margin: 0 0 8px; font-size: 1.3rem; }
.nav-card p { margin: 0; color: var(--muted); line-height: 1.45; }
.nav-link { margin-top: 18px; font-weight: 750; color: var(--primary); }
.form-grid { display: grid; gap: 16px; }
.field { display: grid; gap: 7px; }
label { font-size: .9rem; font-weight: 700; color: #344054; }
input[type=text], input[type=password], select {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #fff;
  font: inherit;
  outline: none;
}
input:focus, select:focus { border-color: #7ba0ce; box-shadow: 0 0 0 3px rgba(36,84,147,.12); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.btn {
  border: 0;
  border-radius: 11px;
  padding: 12px 17px;
  font: inherit;
  font-weight: 750;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-2); }
.btn-secondary { background: #e8edf4; color: #243247; }
.btn-danger { background: #f4e6e6; color: var(--danger); }
.helper { font-size: .86rem; color: var(--muted); line-height: 1.4; }
.notice { padding: 12px 14px; border-radius: 11px; background: #f7f9fc; color: #40506a; border: 1px solid var(--border); }
.dropdown {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 11px;
  overflow: hidden;
  background: #fff;
  max-height: 240px;
  overflow-y: auto;
}
.dropdown.hidden { display: none; }
.dropdown div { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid #edf0f4; color: var(--text); }
.dropdown div:last-child { border-bottom: 0; }
.dropdown div:hover { background: #f5f7fb; }
.mixer-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(86px, 1fr));
  gap: 14px;
}
.eq-band, .volume-card {
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  display: grid;
  justify-items: center;
  gap: 10px;
}
.eq-band label, .volume-card label { text-align: center; }
.eq-slider {
  writing-mode: bt-lr;
  -webkit-appearance: slider-vertical;
  width: 28px;
  height: 180px;
}
.range-row { display: grid; gap: 8px; }
.range-row input[type=range] { width: 100%; }
.choice-row { display: flex; gap: 10px; flex-wrap: wrap; }
.choice {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  background: #fff;
}
.section-title { margin: 0 0 14px; font-size: 1.1rem; }
.value { font-weight: 800; color: var(--primary); }
@media (max-width: 900px) {
  .grid-3 { grid-template-columns: 1fr; }
  .mixer-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 560px) {
  .topbar { padding: 15px 16px; }
  .page { width: min(100% - 18px, 1120px); margin-top: 18px; }
  .card { padding: 17px; border-radius: 14px; }
  .page-head { align-items: flex-start; flex-direction: column; }
  .mixer-grid { grid-template-columns: 1fr 1fr; }
  .eq-slider { height: 145px; }
  .actions .btn { flex: 1 1 140px; }
}
</style>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><div class="brand-title" id="main-header">Snapcast Client</div><div class="brand-sub">Geräteeinstellungen</div></div>
  <div class="status-pill" id="status-pill">verbinde…</div>
</header>
<main class="page">
  <div class="page-head">
    <div><h1 class="page-title">Gerät</h1><p class="page-copy">Vergib einen verständlichen Namen für diesen Client.</p></div>
  </div>
  <section class="card">
    <div class="form-grid">
      <div class="field">
        <label for="device-name-input">Gerätename</label>
        <input type="text" id="device-name-input" placeholder="z. B. Küche">
      </div>
      <div class="helper">Dieser Name wird auch für die Anzeige des Clients verwendet.</div>
    </div>
    <div class="actions">
      <a class="btn btn-secondary" href="/">Zurück</a>
      <button class="btn btn-danger" id="reset-button" type="button">Reset</button>
      <button class="btn btn-secondary" id="ota-button" type="button">Firmware Update</button>
      <button class="btn btn-primary" id="save-button" type="button">Speichern</button>
    </div>
  </section>
</main>
</div>
<script>
let socket = null;
function setStatus(text) { document.getElementById('status-pill').textContent = text; }
window.addEventListener('load', () => {
  socket = new WebSocket(`ws://${window.location.hostname}/ws`);
  socket.onopen = () => { setStatus('verbunden'); socket.send(JSON.stringify({type:0})); };
  socket.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 1 && data["device-name"]) {
        document.getElementById('main-header').textContent = data["device-name"];
        document.getElementById('device-name-input').value = data["device-name"];
      }
    } catch(e) {}
  };
  socket.onerror = () => setStatus('Fehler');
  socket.onclose = () => setStatus('offline');
});
document.getElementById('save-button').onclick = () => {
  const name = document.getElementById('device-name-input').value.trim();
  if (!name) return alert('Bitte Gerätenamen eingeben.');
  if (!socket || socket.readyState !== WebSocket.OPEN) return alert('WebSocket ist nicht verbunden.');
  socket.send(JSON.stringify({type:3, device:name}));
};
document.getElementById('reset-button').onclick = () => {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({type:0}));
};

document.getElementById('ota-button').onclick = () => {
  if (!socket || socket.readyState !== WebSocket.OPEN) return alert('WebSocket ist nicht verbunden.');
  if (!confirm('Firmware-Update wirklich starten?')) return;

  socket.send(JSON.stringify({type:4}));
};
</script>
</body>
</html>
